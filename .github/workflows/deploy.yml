name: Build and Deploy

# 向主干 main 分支推送代码时触发部署（生产环境）
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      # 本项目无第三方依赖、无构建步骤：CLI 自动构建并上传当前目录
      # -a overseas 必须携带（区域参数不持久化，漏带会回退 global）；项目已存在时更新现有项目
      - name: Deploy to EdgeOne Makers
        run: npx edgeone makers deploy -n ip-check -a overseas -t "${{ secrets.EDGEONE_API_TOKEN }}"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}